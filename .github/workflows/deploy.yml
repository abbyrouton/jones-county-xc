name: Deploy to Lightsail

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build backend
        working-directory: ./backend
        run: |
          GOOS=linux GOARCH=amd64 go build -o server main.go

      - name: Create .env file for backend
        run: |
          cat > backend/.env << EOF
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          EOF

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/*,backend/server,backend/.env"
          target: "/tmp/deploy"
          strip_components: 1

      - name: Install and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Copy frontend files
            sudo rm -rf /var/www/jones-county-xc/frontend/*
            sudo mkdir -p /var/www/jones-county-xc/frontend
            sudo cp -r /tmp/deploy/dist/* /var/www/jones-county-xc/frontend/

            # Copy backend files
            sudo mkdir -p /var/www/jones-county-xc/backend
            sudo cp /tmp/deploy/server /var/www/jones-county-xc/backend/
            sudo cp /tmp/deploy/.env /var/www/jones-county-xc/backend/
            sudo chmod +x /var/www/jones-county-xc/backend/server
            sudo chown -R ubuntu:ubuntu /var/www/jones-county-xc

            # Create systemd service if it doesn't exist
            if [ ! -f /etc/systemd/system/jones-county-xc.service ]; then
              sudo tee /etc/systemd/system/jones-county-xc.service > /dev/null <<'EOFSERVICE'
            [Unit]
            Description=Jones County XC Backend
            After=network.target mysql.service
            Wants=mysql.service

            [Service]
            Type=simple
            User=ubuntu
            WorkingDirectory=/var/www/jones-county-xc/backend
            ExecStart=/var/www/jones-county-xc/backend/server
            Restart=always
            RestartSec=5
            Environment="GIN_MODE=release"

            [Install]
            WantedBy=multi-user.target
            EOFSERVICE
              sudo systemctl daemon-reload
              sudo systemctl enable jones-county-xc
            fi

            # Restart backend service
            sudo systemctl restart jones-county-xc

            # Wait for service to start
            sleep 2

            # Check service status
            sudo systemctl status jones-county-xc --no-pager || true

            # Clean up
            rm -rf /tmp/deploy

            echo "Deployment complete!"
